name: Fetch October JAO and SEECAO winners

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-october-winners-full.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and normalize October 2026 winners
        shell: bash
        run: |
          cat > /tmp/fetch_winners.py <<'PY'
import csv, json, re, html, os, sys, urllib.parse, urllib.request
from collections import Counter, defaultdict

MONTH = "2026-10"
JAO_PROXY = "https://www.jao.eu/api/v1/auction/calls/getauctions"
JAO_AUCTIONS_PAGE = "https://www.jao.eu/auctions"
SEE_BASE = "https://api.seecao.com"
EIC_XML = "https://eepublicdownloads.blob.core.windows.net/cio-lio/xml/allocated-eic-codes.xml"
EIC_PAGE = "https://www.entsoe.eu/data/energy-identification-codes-eic/eic-approved-codes/"

JAO_CORRIDORS = {
    "HU-RS","RS-HU","HR-RS","RS-HR","RO-RS","RS-MK",
    "HU-UA","UA-HU","RO-UA","UA-RO","SK-UA","UA-SK",
}

AREAS = {
  "AL":"10YAL-KESH-----5","BA":"10YBA-JPCC-----D","GR":"10YGR-HTSO-----Y",
  "HR":"10YHR-HEP------M","IT":"10YIT-GRTN-----B","ME":"10YCS-CG-TSO---S",
  "MK":"10YMK-MEPSO----8","TR":"10YTR-TEIAS----W","XK":"10Y1001C--00100H",
}
SEE_DIRECTIONS = [
 ("AL","GR"),("AL","ME"),("AL","XK"),("BA","HR"),("BA","ME"),
 ("GR","AL"),("GR","MK"),("GR","TR"),("HR","BA"),("IT","ME"),
 ("ME","AL"),("ME","BA"),("ME","IT"),("ME","XK"),("MK","GR"),
 ("MK","XK"),("TR","GR"),("XK","AL"),("XK","ME"),("XK","MK"),
]

UA = "Mozilla/5.0 (compatible; OctoberWinnerCollector/1.0)"

def http_json(url, method="GET", data=None, headers=None, timeout=60):
    h = {"User-Agent": UA, "Accept": "application/json, text/plain, */*"}
    if headers: h.update(headers)
    body = None
    if data is not None:
        body = json.dumps(data).encode("utf-8")
        h["Content-Type"] = "application/json"
    req = urllib.request.Request(url, data=body, headers=h, method=method)
    with urllib.request.urlopen(req, timeout=timeout) as resp:
        return json.loads(resp.read().decode("utf-8"))

def get_jao():
    payload = http_json(
        JAO_PROXY, method="POST",
        data={"horizon":"Monthly","shadow":"0","fromdate":"2026-09-01-00:00:00","todate":"2026-09-30-23:59:59"},
        headers={"Origin":"https://www.jao.eu","Referer":"https://www.jao.eu/auctions"},
        timeout=120,
    )
    rows=[]; auctions=[]
    for a in payload if isinstance(payload, list) else []:
        corridor = str(a.get("corridorCode") or "")
        if corridor not in JAO_CORRIDORS: continue
        start = str(a.get("marketPeriodStart") or "")
        ident = str(a.get("identification") or "")
        if "261001" not in ident and not start.startswith("2026-09-30") and not start.startswith("2026-10-01"): continue
        res = (a.get("results") or [{}])[0] or {}
        prod = (a.get("products") or [{}])[0] or {}
        winners=[]
        for w in a.get("winningParties") or []:
            e = str(w.get("eicCode") if isinstance(w,dict) else w).strip().upper()
            if e: winners.append(e)
        auctions.append({
            "provider":"JAO","auction_id":ident,"direction":corridor.replace("-","→"),
            "from_zone":corridor.split("-")[0],"to_zone":corridor.split("-")[1],
            "offered_mw":res.get("offeredCapacity"),"requested_mw":res.get("requestedCapacity"),
            "allocated_mw":res.get("allocatedCapacity"),"clearing_price":res.get("auctionPrice"),
            "successful_participants":prod.get("winnerPartyCount"),"winner_eics":winners,
            "source_url":JAO_AUCTIONS_PAGE,
        })
        for e in winners:
            rows.append({
                "Delivery Month":MONTH,"Provider":"JAO","Direction":corridor.replace("-","→"),
                "From Zone":corridor.split("-")[0],"To Zone":corridor.split("-")[1],
                "Winner":"","Winner EIC":e,"Participant Awarded MW":"",
                "Auction Offered MW":res.get("offeredCapacity"),"Auction Requested MW":res.get("requestedCapacity"),
                "Auction Allocated MW":res.get("allocatedCapacity"),"Clearing Price EUR/MWh":res.get("auctionPrice"),
                "Auction ID":ident,"Winner Evidence":"JAO winningParties explicit Party EIC; participant MW not published",
                "Source URL":JAO_AUCTIONS_PAGE,"Successful Participants":prod.get("winnerPartyCount"),
            })
    return rows, auctions

def get_seecao():
    rows=[]; auctions=[]; errors=[]
    base_headers={"Origin":"https://seecao.com","Referer":"https://seecao.com/auctions/"}
    for fr,to in SEE_DIRECTIONS:
        q=urllib.parse.urlencode({"type":"monthly","inArea":AREAS[to],"outArea":AREAS[fr],"month":MONTH})
        filter_url=f"{SEE_BASE}/api/data/filter?{q}"
        try:
            f=http_json(filter_url, headers=base_headers)
            ids=f.get("auctions") or [] if isinstance(f,dict) else []
        except Exception as ex:
            errors.append({"stage":"filter","direction":f"{fr}→{to}","error":repr(ex)})
            continue
        for aid in ids:
            detail_url=f"{SEE_BASE}/api/data?auctionIdentification={urllib.parse.quote(str(aid))}"
            try:
                d=http_json(detail_url, headers=base_headers)
            except Exception as ex:
                errors.append({"stage":"detail","direction":f"{fr}→{to}","auction_id":str(aid),"error":repr(ex)})
                continue
            ad=d.get("auctionData") if isinstance(d,dict) else {}
            table=(ad or {}).get("table") or []
            for t in table:
                row_aid=str(t.get("auctionId") or aid)
                eics=[]
                for e in t.get("participantsSold") or []:
                    e=str(e).strip().upper()
                    if e: eics.append(e)
                auctions.append({
                    "provider":"SEE_CAO","auction_id":row_aid,"direction":f"{fr}→{to}",
                    "from_zone":fr,"to_zone":to,"offered_mw":t.get("offered"),
                    "requested_mw":t.get("requested"),"allocated_mw":t.get("allocated"),
                    "clearing_price":t.get("price"),"successful_participants":t.get("numberOfSuccessfullParticipants"),
                    "winner_eics":eics,"source_url":detail_url,
                })
                for e in eics:
                    rows.append({
                        "Delivery Month":MONTH,"Provider":"SEE CAO","Direction":f"{fr}→{to}",
                        "From Zone":fr,"To Zone":to,"Winner":"","Winner EIC":e,
                        "Participant Awarded MW":"","Auction Offered MW":t.get("offered"),
                        "Auction Requested MW":t.get("requested"),"Auction Allocated MW":t.get("allocated"),
                        "Clearing Price EUR/MWh":t.get("price"),"Auction ID":row_aid,
                        "Winner Evidence":"SEE CAO participantsSold explicit EIC; participant MW not published",
                        "Source URL":detail_url,"Successful Participants":t.get("numberOfSuccessfullParticipants"),
                    })
    return rows, auctions, errors

def tag_value(block, names):
    for name in names:
        esc=re.escape(name)
        m=re.search(r"<"+esc+r"(?:\s[^>]*)?>([\s\S]*?)</"+esc+r">", block, flags=re.I)
        if m:
            return html.unescape(re.sub(r"<[^>]+>"," ",m.group(1))).strip()
    return None

def resolve_eics(eics):
    wanted=set(eics); result={}; err=None
    try:
        req=urllib.request.Request(EIC_XML,headers={"User-Agent":UA,"Accept":"application/xml,text/xml,*/*"})
        with urllib.request.urlopen(req,timeout=120) as resp:
            xml=resp.read().decode("utf-8","replace")
        for m in re.finditer(r"<EICCode_MarketDocument\b[\s\S]*?</EICCode_MarketDocument>",xml,flags=re.I):
            block=m.group(0)
            if not any(e in block for e in wanted-result.keys()):
                continue
            e=tag_value(block,["mRID","EICCode","eicCode"])
            if not e: continue
            e=e.strip().upper()
            if e not in wanted: continue
            company=tag_value(block,["long_Names.name","longName","name","eICCode_MarketParticipant.name"])
            display=tag_value(block,["display_Names.name","displayName","short_Names.name"])
            if company or display: result[e]=(company or display or e, display or "")
    except Exception as ex:
        err=repr(ex)
    return result, err

def dedupe(rows):
    out=[]; seen=set()
    for r in rows:
        key=(r["Provider"],r["Auction ID"],r["Direction"],r["Winner EIC"])
        if key in seen: continue
        seen.add(key); out.append(r)
    return out

os.makedirs("out",exist_ok=True)
jao_rows, jao_auctions = get_jao()
see_rows, see_auctions, see_errors = get_seecao()
rows=dedupe(jao_rows+see_rows)
all_eics=[r["Winner EIC"] for r in rows]
lookup,eic_error=resolve_eics(all_eics)
for r in rows:
    r["Winner"]=lookup.get(r["Winner EIC"],("Unresolved EIC",""))[0]
rows.sort(key=lambda r:(r["Provider"],r["Direction"],r["Auction ID"],r["Winner"]))

fields=["Delivery Month","Provider","Direction","From Zone","To Zone","Winner","Winner EIC","Participant Awarded MW","Auction Offered MW","Auction Requested MW","Auction Allocated MW","Clearing Price EUR/MWh","Auction ID","Winner Evidence","Source URL","Successful Participants"]
with open("out/JAO_SEECAO_monthly_winners_2026-10.csv","w",newline="",encoding="utf-8-sig") as f:
    w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
with open("out/jao_october_2026.json","w",encoding="utf-8") as f: json.dump({"auctions":jao_auctions,"rows":jao_rows},f,ensure_ascii=False,indent=2)
with open("out/seecao_october_2026.json","w",encoding="utf-8") as f: json.dump({"auctions":see_auctions,"rows":see_rows,"errors":see_errors},f,ensure_ascii=False,indent=2)
with open("out/eic_lookup_used.csv","w",newline="",encoding="utf-8-sig") as f:
    w=csv.writer(f); w.writerow(["EIC","Company","Display Name","Source URL","Registry Download URL"])
    for e in sorted(set(all_eics)):
        company,display=lookup.get(e,("Unresolved EIC",""))
        w.writerow([e,company,display,EIC_PAGE,EIC_XML])

def unique_auctions(provider):
    return len({r["Auction ID"] for r in rows if r["Provider"]==provider})
def unique_winners(provider=None):
    return len({r["Winner EIC"] for r in rows if provider is None or r["Provider"]==provider})
summary={
 "month":MONTH,"generated_at_utc":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
 "total_rows":len(rows),"unique_eics":unique_winners(),"unresolved_eics":sum(1 for e in set(all_eics) if e not in lookup),
 "JAO":{"winner_rows":sum(1 for r in rows if r["Provider"]=="JAO"),"auctions":unique_auctions("JAO"),"unique_eics":unique_winners("JAO"),"corridors":sorted({r["Direction"] for r in rows if r["Provider"]=="JAO"})},
 "SEE_CAO":{"winner_rows":sum(1 for r in rows if r["Provider"]=="SEE CAO"),"auctions":unique_auctions("SEE CAO"),"unique_eics":unique_winners("SEE CAO"),"corridors":sorted({r["Direction"] for r in rows if r["Provider"]=="SEE CAO"}),"errors":see_errors},
 "eic_registry_error":eic_error,
}
with open("out/summary.json","w",encoding="utf-8") as f: json.dump(summary,f,ensure_ascii=False,indent=2)
print(json.dumps(summary,ensure_ascii=False,indent=2))
PY
          python /tmp/fetch_winners.py

      - name: Upload normalized winner data
        uses: actions/upload-artifact@v4
        with:
          name: october-jao-seecao-winners
          path: out/
          retention-days: 7
