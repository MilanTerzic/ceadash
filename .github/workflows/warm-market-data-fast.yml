name: Warm market data fast

on:
  schedule:
    # Stagger away from minute 0. Prices and flows are the high-frequency public datasets.
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:

concurrency:
  group: cea-warm-market-data-fast
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      CEA_DASH_URL: https://ceadash.lovable.app
    steps:
      - name: Require automation token
        shell: bash
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "AUTOMATION_TOKEN repository secret is required." >&2
            exit 1
          fi

      - name: Refresh canonical day-ahead prices
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 900 \
            --retry 2 --retry-delay 20 --retry-all-errors \
            --request POST \
            -H "Authorization: Bearer ${AUTOMATION_TOKEN}" \
            "${CEA_DASH_URL}/api/warm-market-data?pipeline=prices&mode=tail")
          echo "$response" | jq .
          test "$(echo "$response" | jq -r '.ok')" = "true"

      - name: Refresh canonical physical flows
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 900 \
            --retry 2 --retry-delay 20 --retry-all-errors \
            --request POST \
            -H "Authorization: Bearer ${AUTOMATION_TOKEN}" \
            "${CEA_DASH_URL}/api/warm-market-data?pipeline=flows&mode=tail")
          echo "$response" | jq .
          test "$(echo "$response" | jq -r '.ok')" = "true"
