name: Package October winner data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-jao-seecao.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload October data
        uses: actions/upload-artifact@v4
        with:
          name: october-jao-seecao-winners
          path: tmp/october-winners/
          retention-days: 7
