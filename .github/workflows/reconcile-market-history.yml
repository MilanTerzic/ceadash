name: Reconcile market history

on:
  schedule:
    # Daily repair of the last seven completed delivery days.
    - cron: "37 2 * * *"
  workflow_dispatch:

concurrency:
  group: cea-reconcile-market-history
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      CEA_DASH_URL: https://ceadash.lovable.app
    strategy:
      fail-fast: false
      matrix:
        pipeline: [prices, flows, capacity, fundamentals]
    steps:
      - name: Require automation token
        shell: bash
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "AUTOMATION_TOKEN repository secret is required." >&2
            exit 1
          fi

      - name: Reconcile ${{ matrix.pipeline }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 1200 \
            --retry 2 --retry-delay 30 --retry-all-errors \
            --request POST \
            -H "Authorization: Bearer ${AUTOMATION_TOKEN}" \
            "${CEA_DASH_URL}/api/warm-market-data?pipeline=${{ matrix.pipeline }}&mode=history")
          echo "$response" | jq .
          test "$(echo "$response" | jq -r '.ok')" = "true"
